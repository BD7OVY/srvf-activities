name: 定时抓取活动数据

on:
  schedule:
    # 每小时一次（UTC 第 23 分 ≈ 北京时间 每小时 :23），新帖最长延迟约 1 小时
    - cron: '23 * * * *'
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 抓取论坛活动（增量刷新）
        run: python3 scripts/scrape.py

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activities.json scripts/state.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新活动数据 $(date '+%Y-%m-%d %H:%M')"
            git push
            echo "已提交并推送，Pages 将自动更新"
          fi
